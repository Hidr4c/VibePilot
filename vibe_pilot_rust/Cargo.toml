[package]
name = "vibepilot"
version = "1.0.1"
edition = "2021"
description = "Visual AI automation orchestrator - Rust port"
license = "MIT"
repository = "https://github.com/Hidr4c/VibePilot"
homepage = "https://github.com/Hidr4c/VibePilot"
keywords = ["automation", "llm", "vision", "windows", "rpa"]
categories = ["gui", "automation"]
readme = "README.md"

[[bin]]
name = "vibepilot"
path = "src/main.rs"

[[bin]]
name = "vibepilot_master"
path = "src/master_main.rs"

[dependencies]
# GUI: egui for immediate-mode, cross-platform, lightweight UI
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.31", features = ["serde"] }

# HTTP client for LLM API
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Screen capture (native Windows API via windows crate)

# Mouse/keyboard control
rdev = "0.5"

# Clipboard
arboard = "3.4"

# File system / config
toml = "0.8"
dirs = "5"
rfd = "0.15"
rmp-serde = "1.3"
zstd = "0.13"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
tempfile = "3"
keyring = "3.0"

# Image processing
image = { version = "0.25", features = ["png", "gif"] }
rusty-tesseract = "1.1"

# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"

# Logging
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Threading
flume = "0.11"
lazy_static = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Security_Cryptography",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
